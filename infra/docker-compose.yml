# KharchaKhata — local dev compose.
#
# Run from repo root:  docker compose -f infra/docker-compose.yml up --build
#
# Build contexts are relative to this file (infra/), so most services set
# `context: ..` (repo root) to reach py/, java/, web/ trees.
#
# Prereq for login_engine: build the fat JAR first —
#   (cd java && ./gradlew :login_engine:bootJar)

name: kharchakhata

services:
  postgres:
    image: postgres:16-alpine
    container_name: kk-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-kharchakhata}
      POSTGRES_USER:     ${POSTGRES_USER:-kharchakhata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kharchakhata}
    ports:
      - "5432:5432"
    volumes:
      - kk-pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kharchakhata}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - kk-net

  ingestion:
    build:
      context: ..
      dockerfile: py/ingestion/Dockerfile
    container_name: kk-ingestion
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_DB:-kharchakhata}
      DB_USER:     ${POSTGRES_USER:-kharchakhata}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kharchakhata}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kk-net

  stager:
    build:
      context: ..
      dockerfile: py/stager/Dockerfile
    container_name: kk-stager
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_DB:-kharchakhata}
      DB_USER:     ${POSTGRES_USER:-kharchakhata}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kharchakhata}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kk-net

  login_engine:
    build:
      context: ../java/login_engine
      dockerfile: Dockerfile
    container_name: kk-login-engine
    environment:
      DB_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kharchakhata}
      DB_USER:     ${POSTGRES_USER:-kharchakhata}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-kharchakhata}
      GOOGLE_CLIENT_ID:       ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET:   ${GOOGLE_CLIENT_SECRET:-}
      APP_OAUTH_REDIRECT_URI: ${APP_OAUTH_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
      APP_JWT_SECRET:         ${APP_JWT_SECRET:-change-me-in-.env}
      CORS_ALLOWED_ORIGINS:   ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kk-net

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: kk-web
    environment:
      API_BASE_URL:     /api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:80"
    depends_on:
      - login_engine
      - ingestion
      - stager
    networks:
      - kk-net

networks:
  kk-net:
    driver: bridge

volumes:
  kk-pg-data:
