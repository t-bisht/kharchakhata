[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stager"
version = "0.1.0"
description = "Lands raw fetched artefacts, normalises, hands off downstream"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stager"]
