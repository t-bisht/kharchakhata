server:
  port: 8082

spring:
  application:
    name: login_engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kharchakhata}
    username: ${DB_USER:kharchakhata}
    password: ${DB_PASSWORD:kharchakhata}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  google:
    client-id:     ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    auth-uri:      https://accounts.google.com/o/oauth2/v2/auth
    token-uri:     https://oauth2.googleapis.com/token
    redirect-uri:  ${APP_OAUTH_REDIRECT_URI:http://localhost:3000/api/auth/google/callback}
    scopes:
      - openid
      - email
      - profile
      - https://www.googleapis.com/auth/gmail.readonly
  oauth:
    post-login:
      default-path: /dashboard
      allowed-paths:
        - /dashboard
        - /expenses
        - /settings
  jwt:
    private-key-path: ${APP_JWT_PRIVATE_KEY_PATH:/Users/obake/codebase/kharchakhata/infra/secrets/jwt-private.pem}
    active-kid:       ${APP_JWT_ACTIVE_KID:v1}
    issuer:           ${APP_JWT_ISSUER:auth_engine}
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:24}
  token-enc:
    # AES-256-GCM key for encrypting login_tokens at rest. Generate with:
    #   openssl rand -base64 32
    # DO NOT use the compose default in staging/prod.
    key: ${APP_TOKEN_ENC_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  internal:
    # Shared secret sent by other services as X-Internal-Auth on /internal/** calls.
    svc-token: ${INTERNAL_SVC_TOKEN:dev-internal-token-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
