server:
  port: 8082

spring:
  application:
    name: login_engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kharchakhata}
    username: ${DB_USER:kharchakhata}
    password: ${DB_PASSWORD:kharchakhata}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${APP_JWT_SECRET:change-me}
    expiration-hours: 24
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
