server:
  port: 8082

spring:
  application:
    name: login_engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kharchakhata}
    username: ${DB_USER:kharchakhata}
    password: ${DB_PASSWORD:kharchakhata}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  google:
    client-id:     ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    auth-uri:      https://accounts.google.com/o/oauth2/v2/auth
    token-uri:     https://oauth2.googleapis.com/token
    redirect-uri:  ${APP_OAUTH_REDIRECT_URI:http://localhost:3000/api/auth/google/callback}
    scopes:
      - openid
      - email
      - profile
      - https://www.googleapis.com/auth/gmail.readonly
  oauth:
    post-login:
      default-path: /dashboard
      allowed-paths:
        - /dashboard
        - /expenses
        - /settings
  jwt:
    secret: ${APP_JWT_SECRET:change-me}
    expiration-hours: 24
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
