# nginx server block for the kharchakhata-web SPA.
#
# Topology (docker-compose):
#   Browser → nginx:80
#             ├─ /api/**        → login_engine:8082
#             ├─ /ingestion/**  → ingestion:8080
#             ├─ /stager/**     → stager:8081
#             └─ /*             → index.html (SPA fallback)

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://login_engine:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /ingestion/ {
        proxy_pass         http://ingestion:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /stager/ {
        proxy_pass         http://stager:8081/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # env.js regenerated on every container start — never cache.
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
